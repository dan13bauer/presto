name: Sync fork master from upstream

# Keeps dan13bauer/presto's master fast-forwarded to prestodb/presto's master
# every 15 minutes. master on this fork is expected to never carry unique
# commits (feature work happens on separate branches), so this only ever
# fast-forwards. If master has diverged, the verify step fails the run instead
# of merging or force-pushing over it.
#
# The fast-forward goes through the merge-upstream REST endpoint rather than
# `git push`. GITHUB_TOKEN is a GitHub App installation token, and app tokens
# may only write under .github/workflows with a Workflows:write permission that
# the workflow `permissions:` block does not expose, so pushing any upstream
# range that touches a workflow file is rejected outright. The endpoint moves
# the ref onto objects that already exist upstream and is not subject to that
# guard.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'dan13bauer/presto'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream master
        run: git fetch https://github.com/prestodb/presto.git master:refs/remotes/upstream/master

      - name: Verify master has not diverged from upstream
        run: |
          if ! git merge-base --is-ancestor HEAD upstream/master; then
            echo "::error::master has commit(s) that upstream/master does not. Someone pushed directly to master instead of a feature branch. Refusing to sync until this is resolved manually." >&2
            exit 1
          fi

      - name: Fast-forward master to upstream/master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merge_type=$(gh api --method POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=master --jq '.merge_type')
          echo "merge_type=${merge_type}"
          # The verify step rules out divergence, so anything but a
          # fast-forward, or a no-op when master is already current, means the
          # ref moved between that check and this call.
          if [ "${merge_type}" != "fast-forward" ] && [ "${merge_type}" != "none" ]; then
            echo "::error::Expected a fast-forward but the endpoint reported: ${merge_type}" >&2
            exit 1
          fi
